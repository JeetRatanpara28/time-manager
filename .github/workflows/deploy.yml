name: CI and Deploy Phoenix to Fly.io

on:
  push:
    branches:
      - main

jobs:
  ci-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASS }}
          POSTGRES_DB: time-manager-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.CI_DB_USER }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASS }}@localhost:5432/time_manager_test
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.4'
          otp-version: '26.1'

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
        working-directory: time_manager_phx

      - name: Install dependencies
        run: mix deps.get
        working-directory: time_manager_phx

      - name: Setup DB
        env:
          DATABASE_URL: postgres://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASS }}@localhost:5432/time_manager_test
        run: |
          mix ecto.create
          mix ecto.migrate
        working-directory: time_manager_phx

      - name: Run tests
        run: mix test
        working-directory: time_manager_phx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io container registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: echo "${FLY_API_TOKEN}" | docker login registry.fly.io -u x --password-stdin

      - name: Build and Push Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest ./time_manager_phx
          docker push registry.fly.io/time-manager-phx:latest

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd time_manager_phx
          flyctl deploy --image registry.fly.io/time-manager-phx:latest --remote-only
