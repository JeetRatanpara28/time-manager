name: CI and Deploy Phoenix to Fly.io

on:
  push:
    branches:
      - main

jobs:
  ci-and-deploy:
    runs-on: ubuntu-latest

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CI_DB_USER: ${{ secrets.CI_DB_USER }}
      CI_DB_PASS: ${{ secrets.CI_DB_PASS }}
      DATABASE_URL: postgres://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASS }}@localhost:5432/time_manager_test
      MIX_ENV: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: time_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.4'
          otp-version: '26.1'

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
        working-directory: time_manager_phx

      - name: Install dependencies
        run: mix deps.get
        working-directory: time_manager_phx

      - name: Wait for Postgres to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U ci_user; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Setup DB
        run: |
          mix ecto.create
          mix ecto.migrate
        working-directory: time_manager_phx
        env:
          PGPASSWORD: ci_pass

      - name: Run tests
        run: mix test
        working-directory: time_manager_phx
        env:
          PGPASSWORD: ci_pass

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io container registry
        run: echo "${FLY_API_TOKEN}" | docker login registry.fly.io -u x --password-stdin

      - name: Build and Push Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest ./time_manager_phx
          docker push registry.fly.io/time-manager-phx:latest

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          cd time_manager_phx
          flyctl deploy --image registry.fly.io/time-manager-phx:latest --remote-only
