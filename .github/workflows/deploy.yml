name: Deploy to Fly.io

on:
  push:
    branches:
      - main  # Change if deploying from a different branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install Fly.io CLI
      - name: Install Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl version

      # 3. Authenticate with Fly.io Docker Registry
      - name: Login to Fly.io Docker Registry
        run: |
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t registry.fly.io/time-manager-phx:latest .

      # 5. Push Docker image
      - name: Push Docker image to Fly.io
        run: docker push registry.fly.io/time-manager-phx:latest

      # 6. Deploy the app
      - name: Deploy to Fly.io
        run: |
          export FLYCTL_INSTALL="$HOME/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl deploy --image registry.fly.io/time-manager-phx:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
