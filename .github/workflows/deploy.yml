name: Deploy your custom Docker image to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy custom Docker image to Fly.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io container registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "${FLY_API_TOKEN}" | docker login registry.fly.io -u x --password-stdin

      - name: Build your custom Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest .

      - name: Push your image to Fly.io registry
        run: |
          docker push registry.fly.io/time-manager-phx:latest

      - name: Deploy your custom image
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --image registry.fly.io/time-manager-phx:latest
