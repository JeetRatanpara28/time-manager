name: Deploy to Fly.io

on:
  push:
    branches:
      - main  # Change if you deploy from a different branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3. Authenticate with Fly.io
      - name: Login to Fly.io Docker Registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # 4. Build the Docker image
      - name: Build Docker image
        run: docker build -t registry.fly.io/time-manager-phx:latest .

      # 5. Push the Docker image
      - name: Push Docker image to Fly.io
        run: docker push registry.fly.io/time-manager-phx:latest

      # 6. Deploy the app
      - name: Deploy to Fly.io
        run: flyctl deploy --image registry.fly.io/time-manager-phx:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
