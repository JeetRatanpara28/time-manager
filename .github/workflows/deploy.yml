name: Fly.io Deploy

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Authenticate Fly Docker
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build & push Docker image
        run: |
          docker build -t registry.fly.io/time-manager-vue:latest ./time_manager_vue
          docker push registry.fly.io/time-manager-vue:latest

      - name: Deploy to Fly.io
        run: flyctl deploy --app time-manager-vue --image registry.fly.io/time-manager-vue:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-backend:
    name: Deploy Backend (Phoenix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Authenticate Fly Docker
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build & push Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest ./time_manager_phx
          docker push registry.fly.io/time-manager-phx:latest

      - name: Deploy to Fly.io
        run: flyctl deploy --app time-manager-phx --image registry.fly.io/time-manager-phx:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
