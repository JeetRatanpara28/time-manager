name: Deploy Phoenix to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Phoenix App to Fly.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io container registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "${FLY_API_TOKEN}" | docker login registry.fly.io -u x --password-stdin

      - name: Build Phoenix Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest ./time_manager_phx

      - name: Push Docker image
        run: |
          docker push registry.fly.io/time-manager-phx:latest

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd time_manager_phx
          flyctl deploy --image registry.fly.io/time-manager-phx:latest --remote-only
