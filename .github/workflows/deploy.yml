name: Deploy Phoenix to Fly.io

on:
  push:
    branches:
      - main

jobs:
  ci-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Fill these with your secrets in GitHub Actions
      DATABASE_URL: postgres://${{ secrets.CI_DB_USER }}:${{ secrets.CI_DB_PASS }}@localhost:5432/${{ secrets.CI_DB_NAME }}
      MIX_ENV: prod
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15.4'
          otp-version: '26.1'

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io container registry
        run: |
          echo "${{ secrets.FLY_API_TOKEN }}" | docker login registry.fly.io -u x --password-stdin

      - name: Build and Push Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest ./time_manager_phx
          docker push registry.fly.io/time-manager-phx:latest

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          cd time_manager_phx
          flyctl deploy --image registry.fly.io/time-manager-phx:latest --remote-only
