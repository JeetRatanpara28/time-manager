name: Deploy Phoenix to Fly.io

on:
  push:
    branches:
      - main   # Runs only when you push to main branch

jobs:
  deploy:
    name: Build and Deploy Phoenix App to Fly.io
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker buildx (for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Log in to Fly.io container registry
      - name: Log in to Fly.io container registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "${FLY_API_TOKEN}" | docker login registry.fly.io -u x --password-stdin

      # 4️⃣ Build Docker image for Phoenix app
      - name: Build Phoenix Docker image
        run: |
          docker build -t registry.fly.io/time-manager-phx:latest ./time_manager_phx

      # 5️⃣ Push image to Fly.io registry
      - name: Push Docker image to Fly.io registry
        run: |
          docker push registry.fly.io/time-manager-phx:latest

      # 6️⃣ Deploy image to Fly.io
      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd time_manager_phx
          flyctl deploy --remote-only

