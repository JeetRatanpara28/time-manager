app = "time-manager-phx"

kill_signal = "SIGTERM"
kill_timeout = 5
processes = []

[env]
  PHX_SERVER = "true"
# Don't hardcode PORT — Fly sets it automatically
# PORT = "4000" ❌ remove this

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 8080
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls","http"]
