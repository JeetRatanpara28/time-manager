app = "time-manager-phx"

kill_signal = "SIGTERM"
kill_timeout = 5
processes = []

[env]
  PHX_SERVER = "true"

[experimental]
  auto_rollback = true

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [services.http_checks]
    protocol = "http"
    path = "/"
    interval = "10s"
    timeout = "5s"